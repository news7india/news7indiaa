name: news7india_app
description: "News 7 India - Official Flutter Android News & Reporter Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.2
  cached_network_image: ^3.3.1
  webview_flutter: ^4.10.0
  webview_flutter_android: ^3.16.0
  flutter_html: ^3.0.0-beta.2
  intl: ^0.19.0
  share_plus: ^10.0.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/